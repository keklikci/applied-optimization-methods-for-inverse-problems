[project]
name = "aomip"
version = "0.1.0"
description = "Applied optimization methods for inverse problems"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "David Frank", email = "frankd@in.tum.de" }]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=9.5",
    "scikit-image>=0.20",
    "scipy>=1.10",
    "tifffile>=2023.4.12",
]

[dependency-groups]
dev = [
    "jupyterlab>=3.6",
    "pytest>=7.3",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aomip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["homework/*/output", "homework/*/images"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv]
default-groups = ["dev"]
